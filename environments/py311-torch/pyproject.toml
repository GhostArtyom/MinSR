[project]
name = "minsr-py311-torch"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "matplotlib==3.8.3",
    "numpy==1.26.3",
    "scipy==1.13.1",
    "torch==2.10.0",
]

[project.optional-dependencies]
ed = [
    "dill==0.3.7",
    "gmpy2>=2.3.2",
    "joblib==1.2.0",
    "numba==0.59.0",
    "numexpr==2.8.7",
    "six>=1.17.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
package = false

[tool.uv.sources]
torch = { index = "torch-cuda" }

[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
