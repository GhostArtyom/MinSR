[project]
name = "minsr-py311-torch"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dill==0.3.7",
    "gmpy2>=2.3.2",
    "joblib==1.2.0",
    "matplotlib==3.8.3",
    "numba==0.59.0",
    "numexpr==2.8.7",
    "numpy==1.26.3",
    "quspin",
    "scipy==1.13.1",
    "six>=1.17.0",
    "torch==2.10.0",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
package = false

[tool.uv.sources]
quspin = { path = "../QuSpin/dist/quspin-0.3.7-cp311-cp311-linux_x86_64.whl" }
torch = { index = "torch-cuda" }

[[tool.uv.index]]
name = "torch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
